name: Aquarium performance hotfix checks
on:
  push:
    branches:
      - perf/shop-culling-adaptive-dpr-20261108
  pull_request:
    paths:
      - 'public/assets/*.js'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/performance-hotfix.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:backend
      - run: npx playwright install --with-deps chromium
      - name: Measure Shop long tasks and check mobile
        env:
          CHROMIUM_PATH: ''
          TEST_FILTER: 'Shop:|Mobile:'
        run: npm run test:frontend
      - name: Upload browser perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shop-performance-results
          path: test-results/
          if-no-files-found: ignore
