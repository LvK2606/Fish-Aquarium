<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aqualator</title>
    <meta name="description" content="Raise fish, grow plants, build your own aquarium." />
    <meta name="theme-color" content="#4cc3e0" />
    <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aqualator" />
    <meta property="og:title" content="Aqualator" />
    <meta property="og:description" content="Raise fish, grow plants, build your own aquarium." />
    <meta property="og:url" content="https://fish-aquarium-five.vercel.app/" />
    <meta property="og:image" content="https://fish-aquarium-five.vercel.app/brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/fonts/baloo-2.css" />
    <link rel="preload" href="/brand/scene.svg" as="image" />
    <link rel="preload" href="/brand/wordmark.png" as="image" />
    <link rel="stylesheet" href="/brand/splash.css" />
    <!-- Preview-only convenience: ?shop=1 skips onboarding and opens Shop without changing saved aquariums. -->
    <script>
      (() => {
        const directShopUrl = new URL(window.location.href);
        if (directShopUrl.searchParams.get('shop') !== '1') return;

        // Apply existing in-app tutorial/dialogue flags before the main bundle boots.
        directShopUrl.searchParams.set('hocviec', '0');
        directShopUrl.searchParams.set('hoithoai', '0');
        history.replaceState(history.state, '', directShopUrl.pathname + directShopUrl.search + directShopUrl.hash);

        window.addEventListener('DOMContentLoaded', () => {
          let checks = 0;
          const timer = window.setInterval(() => {
            const splash = document.getElementById('boot');
            if (splash && !splash.classList.contains('is-done')) return;
            if (document.querySelector('.shop-modal')) {
              window.clearInterval(timer);
              return;
            }
            const shop = Array.from(document.querySelectorAll('#root .tool')).find(button =>
              button.matches('[data-tour="shop"]') ||
              /^(Shop|Cửa hàng|商店|ショップ)$/i.test(button.textContent.trim())
            );
            if (shop && !shop.hasAttribute('disabled') && shop.getClientRects().length) {
              shop.click();
              window.clearInterval(timer);
            }
            if (++checks >= 200) window.clearInterval(timer);
          }, 300);
        }, { once: true });
      })();
    </script>
    <script type="module" crossorigin src="/assets/main-CvOo3B9w.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/tokens-CRUX-1Pp.js">
    <link rel="stylesheet" crossorigin href="/assets/tokens-CaFZIQom.css">
    <link rel="stylesheet" crossorigin href="/assets/main-BgQ148XD.css">
    <link rel="stylesheet" href="/replica.css" />
  </head>
  <body>
    <!-- Màn hình đang tải: hiện ngay khi trang mở, src/boot.ts gỡ khi bể đã vẽ xong -->
    <div id="boot" class="aq-boot" role="status" aria-busy="true">
      <picture>
        <source media="(max-aspect-ratio: 4/5)" srcset="/brand/scene-tall.svg" />
        <img class="aq-scene" src="/brand/scene.svg" alt="" />
      </picture>
      <div class="aq-center">
        <div class="aq-lockup">
          <img class="aq-fish" src="/brand/fish.svg" alt="" width="240" height="185" />
          <img class="aq-wordmark" src="/brand/wordmark.png" alt="Aqualator" width="664" height="212" />
        </div>
        <div class="aq-bar"><div class="aq-fill"></div></div>
        <p class="aq-tip"><img src="/brand/loader.svg" alt="" width="32" height="32" /><span></span></p>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
